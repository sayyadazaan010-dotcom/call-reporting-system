<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Call Reporting System - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-wrap {
    width: min(420px, 94vw);
    padding: 28px 28px 24px;
    text-align: center;
    margin: 24px 0;
    animation: fadeInUp 0.7s ease;
    position: relative;
    z-index: 2;
    background: linear-gradient(165deg, rgba(8,14,36,0.82), rgba(4,8,22,0.9));
    border: 1px solid rgba(59,130,246,0.45);
    border-radius: 22px;
    box-shadow:
      0 0 50px rgba(59,130,246,0.2),
      0 0 100px rgba(34,211,238,0.08),
      inset 0 0 50px rgba(59,130,246,0.05);
    backdrop-filter: blur(10px);
  }

  /* Animated lightning bolt hero */
  .bolt-hero {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 12px;
  }
  .bolt-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(34,211,238,0.35);
    box-shadow:
      0 0 20px rgba(59,130,246,0.45),
      0 0 50px rgba(34,211,238,0.2),
      inset 0 0 25px rgba(59,130,246,0.15);
    animation: ringPulse 2.4s ease-in-out infinite;
  }
  .bolt-ring::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(99,140,255,0.25);
    animation: ringPulse 3.2s ease-in-out infinite reverse;
  }
  .bolt-svg {
    position: absolute;
    inset: 18%;
    width: 64%;
    height: 64%;
    filter: drop-shadow(0 0 12px rgba(34,211,238,0.9))
            drop-shadow(0 0 28px rgba(59,130,246,0.7));
    animation: boltFlash 2.8s ease-in-out infinite;
  }
  .bolt-flash {
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.25) 0%, transparent 65%);
    animation: flashBurst 2.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  @keyframes boltFlash {
    0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(34,211,238,0.7)); }
    15% { opacity: 1; filter: drop-shadow(0 0 22px rgba(255,255,255,0.95)) drop-shadow(0 0 40px rgba(34,211,238,1)); }
    30% { opacity: 0.75; }
    55% { opacity: 1; filter: drop-shadow(0 0 18px rgba(59,130,246,1)); }
  }
  @keyframes flashBurst {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    15% { opacity: 0.85; transform: scale(1.1); }
    40% { opacity: 0.25; transform: scale(1); }
  }

  .login-title {
    font-size: 1.85rem;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 2px;
    text-shadow: 0 0 20px rgba(34,211,238,0.35);
  }
  .login-title span { color: var(--neon-cyan); }
  .login-sub {
    color: var(--text-dim);
    letter-spacing: 5px;
    font-size: 0.82rem;
    margin-bottom: 22px;
  }
  .login-form { text-align: left; }
  .login-form .field-with-icon { margin-bottom: 14px; }
  .login-form .field-input {
    border-color: rgba(59,130,246,0.45);
    background: rgba(4,10,28,0.75);
  }
  .login-form .field-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 16px rgba(34,211,238,0.45);
  }
  .login-btn {
    width: 100%;
    margin-top: 8px;
    font-size: 1.05rem;
    letter-spacing: 2px;
    padding: 14px 20px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    box-shadow: 0 0 22px rgba(59,130,246,0.5);
  }
  .dev-credit {
    margin-top: 22px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .dev-credit b { color: var(--neon-cyan); }
  .toggle-pass {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-dim);
    font-size: 1.1rem;
    touch-action: manipulation;
  }

  @media (max-width: 480px) {
    .login-wrap { padding: 22px 18px 18px; margin: 12px 0; }
    .bolt-hero { width: 130px; height: 130px; }
    .login-title { font-size: 1.55rem; }
  }
</style>
</head>
<body>
  <div class="bg-fx"></div>
  <div class="glow-line"></div>

  <div class="login-wrap panel">
    <div class="bolt-hero">
      <div class="bolt-flash"></div>
      <div class="bolt-ring"></div>
      <svg class="bolt-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="40%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <path fill="url(#boltGrad)" d="M36 4L14 36h14L20 60l30-34H36L48 4z"/>
      </svg>
    </div>

    <div class="login-title">CALL <span>REPORTING</span></div>
    <div class="login-sub">S Y S T E M</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ 'error' if category == 'error' else 'success' }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form class="login-form" method="POST" action="{{ url_for('login') }}">
      <div class="field-with-icon">
        <span class="icon">👤</span>
        <input class="field-input" type="text" name="username" placeholder="User Name" required autofocus autocomplete="username">
      </div>
      <div class="field-with-icon">
        <span class="icon">🔒</span>
        <input class="field-input" type="password" name="password" id="pwField" placeholder="Password" required autocomplete="current-password">
        <span class="toggle-pass" onclick="togglePw()" role="button" aria-label="Show password">👁</span>
      </div>
      <button type="submit" class="btn btn-primary login-btn">LOGIN →</button>
    </form>

    <div class="dev-credit">
      &lt;/&gt; Developed by <b>Azaan</b>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    function togglePw() {
      var f = document.getElementById('pwField');
      f.type = f.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
